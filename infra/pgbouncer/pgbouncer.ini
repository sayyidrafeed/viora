; Satu pool per role service (§6). Batas ditulis eksplisit supaya total koneksi tidak melewati max_connections Postgres (100):
; 7 role x max_user_connections 10 = 70, ditambah koneksi langsung relay dan migrasi.
[databases]
* = host=postgres port=5432

[users]
identity_svc = max_user_connections=10
upload_svc = max_user_connections=10
video_svc = max_user_connections=10
social_svc = max_user_connections=10
feed_svc = max_user_connections=10
notification_svc = max_user_connections=10
live_svc = max_user_connections=10

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 10
max_db_connections = 80
max_client_conn = 500
ignore_startup_parameters = extra_float_digits
admin_users = viora
