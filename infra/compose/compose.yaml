# Dev lokal. Profile `core`: Postgres, Redpanda, Redis durable, Kong.
# Port host digeser (+10000 dari default) supaya tidak bentrok dengan proyek lain.
name: viora

services:
  postgres:
    image: postgres:17.11
    profiles: [core]
    environment:
      POSTGRES_USER: viora
      POSTGRES_PASSWORD: viora-dev
      POSTGRES_DB: viora
    ports: ["127.0.0.1:15432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viora"]
      interval: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    profiles: [core]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["127.0.0.1:16432:6432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U viora"]
      interval: 2s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    profiles: [core]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      retries: 30

  redis-durable:
    image: redis:8.6.8
    profiles: [core]
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]

  kong:
    image: kong:3.9.4
    profiles: [core]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["../kong:/kong:ro"]
    ports: ["127.0.0.1:18000:8000", "127.0.0.1:18001:8001"]
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  pg-data:
